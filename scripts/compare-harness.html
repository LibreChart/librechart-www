<!doctype html><html><head><meta charset="utf-8"><title>compare</title>
<style>body{margin:0;font:12px monospace}iframe{border:0;height:600px;display:block}</style></head>
<body><iframe id="a" src="/index.html"></iframe><iframe id="b" src="/orig.html"></iframe>
<script>
window.probe=function(doc){
  const sels=['header.nav','.nav-inner','.hero','.hero h1','#features','.product','#how','#community','footer.footer'];
  const r={scrollH:doc.body.scrollHeight};
  for(const s of sels){const el=doc.querySelector(s);const b=el&&el.getBoundingClientRect();
    r[s]=el?[Math.round(b.width),Math.round(b.height)]:null;}
  r.h2h=[...doc.querySelectorAll('h2')].map(e=>Math.round(e.getBoundingClientRect().height));
  r.navLinks=getComputedStyle(doc.querySelector('.nav-links')).display;
  r.h1size=getComputedStyle(doc.querySelector('.hero h1')).fontSize;
  return r;};
window.sweep=async function(widths){const A=a,B=b,out={};
  await A.contentWindow.document.fonts.ready; await B.contentWindow.document.fonts.ready;
  for(const w of widths){A.style.width=w+'px';B.style.width=w+'px';
    await new Promise(r=>setTimeout(r,500));
    out[w]={built:probe(A.contentDocument),orig:probe(B.contentDocument)};}
  return out;};
</script></body></html>
