<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LibreChart mark, single-color Ink">
  <!-- Single-color Ink mark for black-and-white field printing. Card and tab knock the ECG trace
       out via a mask so the trace stays legible in one ink; baseline extends past both edges. -->
  <title>LibreChart mark (mono)</title>
  <defs>
    <mask id="ecg-knockout">
      <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"/>
      <path d="M4 33 H21 L23 30.5 L25 33 H29 L30.5 36.5 L32 17 L33.5 41 L35 33 H38 L40 29 L42 33 H60"
            fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#14283C" mask="url(#ecg-knockout)">
    <rect x="13" y="10" width="16" height="9" rx="2.5"/>
    <rect x="10" y="16" width="44" height="34" rx="6"/>
  </g>
  <path d="M4 33 H21 L23 30.5 L25 33 H29 L30.5 36.5 L32 17 L33.5 41 L35 33 H38 L40 29 L42 33 H60"
        fill="none" stroke="#14283C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
